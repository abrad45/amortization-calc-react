version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '11:00'
      timezone: America/New_York
    # Low-traffic repo: batch everything into as few PRs as possible.
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    groups:
      # Security fixes land together, on their own, as soon as they are found
      # (security updates ignore the monthly schedule).
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - '*'
      development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '11:00'
      timezone: America/New_York
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
